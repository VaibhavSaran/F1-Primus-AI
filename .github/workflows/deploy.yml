name: Deploy personal GCP application

on:
  workflow_run:
    workflows: [Verify ver_2]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-personal-gcp
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  ZONE: us-central1-a
  INSTANCE: primus-personal

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and publish immutable application image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="us-central1-docker.pkg.dev/$PROJECT_ID/f1-primus-ai/f1-primus-ai"
          COMMIT=$(git rev-parse HEAD)
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -f docker/Dockerfile.app -t "$IMAGE:$COMMIT" .
          docker push "$IMAGE:$COMMIT"
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE:$COMMIT" --format='value(image_summary.digest)')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "DEPLOY_IMAGE=$IMAGE@$DIGEST" >> "$GITHUB_ENV"
      - name: Deploy through IAP with health check and rollback
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute scp deploy/personal-vm.sh "$INSTANCE:/tmp/primus-deploy.sh" --project="$PROJECT_ID" --zone="$ZONE" --tunnel-through-iap --quiet
          gcloud compute ssh "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" --tunnel-through-iap --quiet --command="sudo bash /tmp/primus-deploy.sh '$DEPLOY_IMAGE'"

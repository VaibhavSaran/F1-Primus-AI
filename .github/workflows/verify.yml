name: Verify ver_2

on:
  push:
    branches: [ver_2]
  pull_request:
    branches: [ver_2, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Bootstrap the isolated primusEnv runtime
        run: python -m venv primusEnv
      - name: Install pinned dependencies
        run: |
          & '.\primusEnv\Scripts\python.exe' -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\primusEnv\Scripts\python.exe' -m pip check
          exit $LASTEXITCODE
      - name: Offline regression and native UI checks
        run: |
          New-Item -ItemType Directory -Force '.scratch/test-runs' | Out-Null
          $env:TEMP=(Resolve-Path '.scratch/test-runs').Path
          $env:TMP=$env:TEMP
          & '.\primusEnv\Scripts\python.exe' -m pytest tests --basetemp='.scratch/test-runs/ci' -q
          exit $LASTEXITCODE
      - name: Import and syntax gate
        run: |
          & '.\primusEnv\Scripts\python.exe' -m compileall -q agents data flows ml monitoring security streamlit_app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          exit $LASTEXITCODE
      - name: Publishable repository hygiene
        run: |
          & '.\primusEnv\Scripts\python.exe' scripts/check_repository.py
          exit $LASTEXITCODE
